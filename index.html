<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト申請</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    body { padding: 15px; background: #f5f5f5; }
    .card { border-radius: 12px; }
    .week-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .week-selector button { border: none; background: #3273dc; color: white; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
    .bulk-section { background: #f0f7ff; border-radius: 8px; padding: 12px; margin-bottom: 1rem; }
    .bulk-title { font-size: 13px; font-weight: bold; color: #0C447C; margin-bottom: 10px; }
    .tmpl-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tmpl-btn { border: 1px solid #3273dc; background: white; color: #3273dc; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .tmpl-btn.active { background: #3273dc; color: white; }
    .tmpl-btn.holiday { border-color: #FFC107; color: #856404; }
    .tmpl-btn.holiday.active { background: #FFC107; color: #856404; }
    .apply-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .apply-btn { border: none; color: white; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .day-row { display: grid; grid-template-columns: 70px 1fr 1fr 72px; gap: 4px; align-items: end; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .day-row:last-child { border-bottom: none; }
    .day-label { font-size: 12px; font-weight: bold; padding-bottom: 6px; }
    .day-label.sat { color: #378ADD; }
    .day-label.sun { color: #E24B4A; }
    .time-wrap { display: flex; flex-direction: column; }
    .time-label { font-size: 10px; color: #888; margin-bottom: 2px; }
    .time-input { border: 1px solid #ddd; border-radius: 6px; padding: 6px 4px; font-size: 13px; width: 100%; box-sizing: border-box; text-align: center; }
    .time-input:disabled { background: #f5f5f5; color: #bbb; }
    .state-btn { border: 1px solid #ddd; border-radius: 6px; padding: 6px 4px; font-size: 12px; width: 100%; background: white; cursor: pointer; text-align: center; }
    .state-btn.holiday { background: #FFF3CD; border-color: #FFC107; color: #856404; font-weight: bold; }
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
  </style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div style="font-size:40px;margin-bottom:1rem">🔐</div>
    <h2 style="font-weight:bold;margin-bottom:0.5rem">スタッフ認証</h2>
    <p style="color:#888;font-size:13px;margin-bottom:1.5rem">お名前と電話番号を入力してください</p>
    <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
    <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
    <div id="authError" style="color:red;font-size:13px;margin-bottom:0.5rem;display:none">名前または電話番号が一致しません。</div>
    <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
  </div>
</div>

<div id="mainContent" style="display:none">
  <div class="card">
    <div class="card-content">
      <h2 style="font-weight:bold;text-align:center;margin-bottom:20px">📅 シフト申請フォーム</h2>
      <div class="field">
        <label class="label">お名前</label>
        <input class="input" type="text" id="userName" readonly style="background:#f5f5f5">
      </div>
      <div class="field">
        <label class="label">対象週</label>
        <div class="week-selector">
          <button onclick="changeWeek(-1)">＜</button>
          <span id="weekLabel" style="font-weight:bold;font-size:14px"></span>
          <button onclick="changeWeek(1)">＞</button>
        </div>
      </div>

      <div class="bulk-section">
        <div class="bulk-title">⚡ 一括入力</div>
        <div class="tmpl-btns">
          <button class="tmpl-btn" onclick="selectTmpl('09:00','17:00',this)">9:00〜17:00</button>
          <button class="tmpl-btn" onclick="selectTmpl('12:00','20:00',this)">12:00〜20:00</button>
          <button class="tmpl-btn" onclick="selectTmpl('15:00','23:00',this)">15:00〜23:00</button>
          <button class="tmpl-btn holiday" onclick="selectTmpl('holiday','',this)">休み</button>
        </div>
        <div class="apply-row">
          <button class="apply-btn" style="background:#3273dc" onclick="applyBulk('all')">全日に適用</button>
          <button class="apply-btn" style="background:#639922" onclick="applyBulk('weekday')">平日のみ</button>
          <button class="apply-btn" style="background:#BA7517" onclick="applyBulk('weekend')">土日のみ</button>
        </div>
      </div>

      <div class="field">
        <label class="label">勤務時間入力</label>
        <p style="font-size:11px;color:#aaa;margin-bottom:8px">※テンプレート選択後、個別に直接修正できます</p>
        <div id="dayRows"></div>
      </div>
      <div class="field">
        <label class="label">備考</label>
        <textarea class="textarea" id="note" rows="2"></textarea>
      </div>
      <button class="button is-success is-fullwidth is-large" onclick="sendShift()">
        <strong>この内容で申請する</strong>
      </button>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
const WEEKDAYS = ['日','月','火','水','木','金','土'];
let weekStart = getMonday(new Date());
let tmplStart = '', tmplEnd = '', tmplHoliday = false;

function selectTmpl(start, end, btn) {
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tmplHoliday = start === 'holiday';
  tmplStart = tmplHoliday ? '' : start;
  tmplEnd   = tmplHoliday ? '' : end;
}

function applyBulk(target) {
  if (!tmplStart && !tmplHoliday) { alert('テンプレートを選択してください'); return; }
  for (let i = 0; i < 7; i++) {
    const date = new Date(weekStart); date.setDate(weekStart.getDate() + i);
    const dow = date.getDay();
    const ok = target==='all' || (target==='weekday' && dow!==0 && dow!==6) || (target==='weekend' && (dow===0||dow===6));
    if (!ok) continue;
    const si = document.getElementById('start_'+i);
    const ei = document.getElementById('end_'+i);
    const sb = document.getElementById('state_'+i);
    if (tmplHoliday) {
      si.value=''; si.disabled=true;
      ei.value=''; ei.disabled=true;
      sb.textContent='休み'; sb.className='state-btn holiday';
    } else {
      si.disabled=false; si.value=tmplStart;
      ei.disabled=false; ei.value=tmplEnd;
      sb.textContent='-'; sb.className='state-btn';
    }
  }
}

function toggleState(i) {
  const si = document.getElementById('start_'+i);
  const ei = document.getElementById('end_'+i);
  const sb = document.getElementById('state_'+i);
  const isHoliday = sb.classList.contains('holiday');
  if (isHoliday) {
    si.disabled=false; ei.disabled=false;
    sb.textContent='-'; sb.className='state-btn';
  } else {
    si.value=''; si.disabled=true;
    ei.value=''; ei.disabled=true;
    sb.textContent='休み'; sb.className='state-btn holiday';
  }
}

async function checkAuth() {
  const name = document.getElementById('authName').value.trim();
  const tel  = document.getElementById('authTel').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  if (!tel)  { alert('電話番号を入力してください'); return; }
  const btn = document.querySelector('#authScreen button');
  btn.disabled=true; btn.textContent='確認中...';
  try {
    const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
    const data = await res.json();
    if (data.auth) {
      document.getElementById('authScreen').style.display='none';
      document.getElementById('mainContent').style.display='block';
      document.getElementById('userName').value=name;
      renderRows();
    } else {
      document.getElementById('authError').style.display='block';
      btn.disabled=false; btn.textContent='確認する';
    }
  } catch(err) { alert('エラー: '+err); btn.disabled=false; btn.textContent='確認する'; }
}

function getMonday(d) { const dt=new Date(d),day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); dt.setHours(0,0,0,0); return dt; }
function fmtDate(d) { return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtFull(d) { return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function changeWeek(delta) { weekStart.setDate(weekStart.getDate()+delta*7); renderRows(); }

function renderRows() {
  const we=new Date(weekStart); we.setDate(weekStart.getDate()+6);
  document.getElementById('weekLabel').textContent=fmtDate(weekStart)+'（月）〜'+fmtDate(we)+'（日）';
  const c=document.getElementById('dayRows'); c.innerHTML='';
  for (let i=0;i<7;i++) {
    const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
    const dow=date.getDay();
    const lc=dow===0?'day-label sun':dow===6?'day-label sat':'day-label';
    const row=document.createElement('div'); row.className='day-row';
    row.innerHTML=`
      <div class="${lc}">${fmtDate(date)}<br>（${WEEKDAYS[dow]}）</div>
      <div class="time-wrap">
        <div class="time-label">開始</div>
        <input class="time-input" type="text" id="start_${i}" placeholder="09:00">
      </div>
      <div class="time-wrap">
        <div class="time-label">終了</div>
        <input class="time-input" type="text" id="end_${i}" placeholder="17:00">
      </div>
      <div class="time-wrap">
        <div class="time-label">状態</div>
        <button class="state-btn" id="state_${i}" onclick="toggleState(${i})">-</button>
      </div>`;
    c.appendChild(row);
  }
}

async function sendShift() {
  const userName=document.getElementById('userName').value.trim();
  if (!userName) { alert('お名前を入力してください'); return; }
  const entries=[];
  for (let i=0;i<7;i++) {
    const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
    const isHoliday=document.getElementById('state_'+i).classList.contains('holiday');
    const s=document.getElementById('start_'+i).value.trim();
    const e=document.getElementById('end_'+i).value.trim();
    if (isHoliday) { entries.push({date:fmtFull(date),shift:'休み'}); }
    else if (s && e) { entries.push({date:fmtFull(date),shift:s+'〜'+e}); }
  }
  if (entries.length===0) { alert('少なくとも1日以上入力してください'); return; }
  const btn=document.querySelector('button.is-success');
  btn.disabled=true; btn.innerHTML='<strong>送信中...</strong>';
  try {
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({type:'shiftNew',userName,entries,note:document.getElementById('note').value})});
    if (res.ok) { alert('申請が完了しました！'); document.getElementById('note').value=''; renderRows(); }
    else throw new Error('サーバーエラー: '+res.status);
  } catch(err) { alert('エラー: '+err); }
  finally { btn.disabled=false; btn.innerHTML='<strong>この内容で申請する</strong>'; }
}
</script>
</body>
</html>
