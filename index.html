<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト申請</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #16324F; --navy-hover: #1E4468; --navy-active: #0F2438;
      --sky: #4FA3D1; --sky-dark: #3A87B5; --sky-bg: #EAF4FA; --sky-border: #B9DDEE;
      --beige: #F5F0E6; --white: #FFFFFF;
      --gray-100: #F7F6F3; --gray-200: #E7E3DA; --gray-300: #D8D3C8;
      --gray-500: #8A8A85; --gray-700: #5B5B57; --text-main: #2B2B28; --text-body: #2B2B28;
      --disabled-bg: #D8D3C8; --disabled-text: #8A8A85;
      --amber: #B98A3D; --amber-bg: #FBF1E3; --amber-text: #8A5A1E; --amber-border: #EBD3AC;
      --error-bg: #FBEAEA; --error-text: #B3261E; --error-border: #E9B7B4;
      --success: #4C8C6B;
      --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
      --shadow-card: 0 4px 24px rgba(22,50,79,0.08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--beige); color: var(--text-body); padding: 20px 16px 40px; -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
 
    .card { border-radius: var(--radius-lg); max-width: 480px; margin: 0 auto; box-shadow: var(--shadow-card); border: none; animation: fadeIn .3s ease-out; }
    .card-content { padding: 2rem 1.6rem; }
 
    .page-title { text-align: center; margin-bottom: 20px !important; }
    .page-title .brand-tag { display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--sky-dark); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .page-title h2 { color: var(--navy); font-weight: 900 !important; font-size: 1.3rem; }
    .title-rule { width: 40px; height: 3px; background: var(--sky); border-radius: 2px; margin: 10px auto 0; }
 
    .label { color: var(--navy); font-weight: 700; font-size: 13px; }
    .input, .textarea {
      background: var(--white); border: 1px solid var(--gray-300); border-radius: 8px;
      font-size: 16px; padding: 12px 14px; color: var(--text-main);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder, .textarea::placeholder { color: var(--gray-500); }
    .input:focus, .textarea:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(79,163,209,0.18); outline: none; }
    .input[readonly] { background: var(--gray-100); color: var(--gray-700); }
 
    .week-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .week-selector button {
      border: none; background: var(--navy); color: white; border-radius: 50%;
      width: 32px; height: 32px; font-size: 15px; cursor: pointer; transition: background-color .15s ease;
    }
    .week-selector button:hover { background: var(--sky-dark); }
    .week-selector span { color: var(--navy); }
 
    .bulk-section { background: var(--beige); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 14px; margin-bottom: 1.2rem; }
    .bulk-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
    .tmpl-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tmpl-btn {
      border: 1px solid var(--navy); background: var(--white); color: var(--navy);
      border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; cursor: pointer;
      transition: background-color .15s ease, color .15s ease, transform .1s ease;
    }
    .tmpl-btn:hover { background: var(--sky-bg); transform: translateY(-1px); }
    .tmpl-btn:active { transform: translateY(0) scale(0.98); }
    .tmpl-btn.active { background: var(--sky); color: white; border-color: var(--sky); }
    .tmpl-btn.holiday { border-color: var(--amber); color: var(--amber-text); }
    .tmpl-btn.holiday.active { background: var(--amber); color: white; border-color: var(--amber); }
    .apply-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .apply-btn {
      border: none; color: white; border-radius: var(--radius-sm); padding: 9px 15px; font-size: 13px;
      cursor: pointer; font-weight: 700; transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .apply-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); opacity: 0.92; }
    .apply-btn:active { transform: translateY(0) scale(0.98); box-shadow: none; opacity: 1; }
 
    .day-row { display: grid; grid-template-columns: 70px 1fr 1fr 76px; gap: 6px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--gray-200); }
    .day-row:last-child { border-bottom: none; }
    .day-label { font-size: 12px; font-weight: 700; padding-bottom: 6px; color: var(--text-main); }
    .day-label.sat { color: var(--sky-dark); }
    .day-label.sun { color: #B3453D; }
    .time-wrap { display: flex; flex-direction: column; }
    .time-label { font-size: 10px; color: var(--gray-700); margin-bottom: 3px; }
    .time-input {
      border: 1px solid var(--gray-300); border-radius: 8px; padding: 8px 4px; font-size: 14px;
      width: 100%; box-sizing: border-box; text-align: center; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .time-input:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(79,163,209,0.18); outline: none; }
    .time-input:disabled { background: var(--disabled-bg); color: var(--disabled-text); }
    .state-btn {
      border: 1px solid var(--gray-300); border-radius: 8px; padding: 8px 4px; font-size: 12px;
      width: 100%; background: white; cursor: pointer; text-align: center; min-height: 38px;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .state-btn:hover { border-color: var(--sky); background: var(--sky-bg); }
    .state-btn.holiday { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-text); font-weight: 700; }
 
    .button.is-success {
      background: var(--navy); border: none; font-weight: 700; border-radius: var(--radius-sm);
      height: auto; padding: 16px; font-size: 15px; min-height: 56px;
      transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .button.is-success:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
    .button.is-success:active { transform: translateY(0) scale(0.99); box-shadow: none; }
    .button.is-success[disabled] { background: var(--disabled-bg); color: var(--disabled-text); }
 
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 100%;
      max-width: 400px; text-align: center; box-shadow: var(--shadow-card); animation: fadeIn .3s ease-out;
    }
    .auth-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--sky-bg); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 1rem; }
    .auth-card h2 { color: var(--navy); font-weight: 700; margin-bottom: 0.35rem; font-size: 1.3rem; }
    .brand-tag { display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--sky-dark); font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; }
    .auth-card p.lead { color: var(--gray-700); font-size: 13px; margin-bottom: 1.5rem; }
    #authError { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text) !important; border-radius: 8px; padding: 8px 10px; }
    .button.is-info {
      background: var(--navy); border: none; font-weight: 700; border-radius: var(--radius-sm); height: auto;
      padding: 13px 14px; font-size: 15px; transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .button.is-info:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
    .button.is-info:active { background: var(--navy-active); transform: translateY(0) scale(0.99); box-shadow: none; }
 
    .footnote { font-size: 11px; color: var(--gray-500); margin-bottom: 8px; }
  </style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <span class="brand-tag">ATTENDANCE MANAGEMENT</span>
    <h2>スタッフ認証</h2>
    <p class="lead">お名前と電話番号を入力してください</p>
    <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
    <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
    <div id="authError" style="font-size:13px;margin-bottom:0.5rem;display:none">名前または電話番号が一致しません。</div>
    <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
  </div>
</div>
<div id="mainContent" style="display:none">
  <div class="card">
    <div class="card-content">
      <div class="page-title">
        <span class="brand-tag">勤怠管理システム</span>
        <h2>シフト申請フォーム</h2>
        <div class="title-rule"></div>
      </div>
      <div class="field">
        <label class="label">お名前</label>
        <input class="input" type="text" id="userName" readonly>
      </div>
      <div class="field">
        <label class="label">対象週</label>
        <div class="week-selector">
          <button onclick="changeWeek(-1)">＜</button>
          <span id="weekLabel" style="font-weight:bold;font-size:14px"></span>
          <button onclick="changeWeek(1)">＞</button>
        </div>
      </div>
      <div class="bulk-section">
        <div class="bulk-title">一括入力</div>
        <div class="tmpl-btns">
          <button class="tmpl-btn" onclick="selectTmpl('09:00','17:00',this)">9:00〜17:00</button>
          <button class="tmpl-btn" onclick="selectTmpl('12:00','20:00',this)">12:00〜20:00</button>
          <button class="tmpl-btn" onclick="selectTmpl('15:00','23:00',this)">15:00〜23:00</button>
          <button class="tmpl-btn holiday" onclick="selectTmpl('holiday','',this)">休み</button>
        </div>
        <div class="apply-row">
          <button class="apply-btn" style="background:#16324F" onclick="applyBulk('all')">全日に適用</button>
          <button class="apply-btn" style="background:#4FA3D1" onclick="applyBulk('weekday')">平日のみ</button>
          <button class="apply-btn" style="background:#B98A3D" onclick="applyBulk('weekend')">土日のみ</button>
        </div>
      </div>
      <div class="field">
        <label class="label">勤務時間入力</label>
        <p class="footnote">※テンプレート選択後、個別に直接修正できます</p>
        <div id="dayRows"></div>
      </div>
      <div class="field">
        <label class="label">備考</label>
        <textarea class="textarea" id="note" rows="2"></textarea>
      </div>
      <button class="button is-success is-fullwidth is-large" onclick="sendShift()">
        <strong>この内容で申請する</strong>
      </button>
    </div>
  </div>
</div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
const WEEKDAYS = ['日','月','火','水','木','金','土'];
let weekStart = getMonday(new Date());
let tmplStart = '', tmplEnd = '', tmplHoliday = false;
function selectTmpl(start, end, btn) {
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tmplHoliday = start === 'holiday';
  tmplStart = tmplHoliday ? '' : start;
  tmplEnd   = tmplHoliday ? '' : end;
}
function applyBulk(target) {
  if (!tmplStart && !tmplHoliday) { alert('テンプレートを選択してください'); return; }
  for (let i = 0; i < 7; i++) {
    const date = new Date(weekStart); date.setDate(weekStart.getDate() + i);
    const dow = date.getDay();
    const ok = target==='all' || (target==='weekday' && dow!==0 && dow!==6) || (target==='weekend' && (dow===0||dow===6));
    if (!ok) continue;
    const si = document.getElementById('start_'+i);
    const ei = document.getElementById('end_'+i);
    const sb = document.getElementById('state_'+i);
    if (tmplHoliday) {
      si.value=''; si.disabled=true;
      ei.value=''; ei.disabled=true;
      sb.textContent='休み'; sb.className='state-btn holiday';
    } else {
      si.disabled=false; si.value=tmplStart;
      ei.disabled=false; ei.value=tmplEnd;
      sb.textContent='-'; sb.className='state-btn';
    }
  }
}
function toggleState(i) {
  const si = document.getElementById('start_'+i);
  const ei = document.getElementById('end_'+i);
  const sb = document.getElementById('state_'+i);
  const isHoliday = sb.classList.contains('holiday');
  if (isHoliday) {
    si.disabled=false; ei.disabled=false;
    sb.textContent='-'; sb.className='state-btn';
  } else {
    si.value=''; si.disabled=true;
    ei.value=''; ei.disabled=true;
    sb.textContent='休み'; sb.className='state-btn holiday';
  }
}
async function checkAuth() {
  const name = document.getElementById('authName').value.trim();
  const tel  = document.getElementById('authTel').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  if (!tel)  { alert('電話番号を入力してください'); return; }
  const btn = document.querySelector('#authScreen button');
  btn.disabled=true; btn.textContent='確認中...';
  try {
    const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
    const data = await res.json();
    if (data.auth) {
      document.getElementById('authScreen').style.display='none';
      document.getElementById('mainContent').style.display='block';
      document.getElementById('userName').value=name;
      renderRows();
    } else {
      document.getElementById('authError').style.display='block';
      btn.disabled=false; btn.textContent='確認する';
    }
  } catch(err) { alert('エラー: '+err); btn.disabled=false; btn.textContent='確認する'; }
}
function getMonday(d) { const dt=new Date(d),day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); dt.setHours(0,0,0,0); return dt; }
function fmtDate(d) { return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtFull(d) { return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function changeWeek(delta) { weekStart.setDate(weekStart.getDate()+delta*7); renderRows(); }
function renderRows() {
  const we=new Date(weekStart); we.setDate(weekStart.getDate()+6);
  document.getElementById('weekLabel').textContent=fmtDate(weekStart)+'（月）〜'+fmtDate(we)+'（日）';
  const c=document.getElementById('dayRows'); c.innerHTML='';
  for (let i=0;i<7;i++) {
    const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
    const dow=date.getDay();
    const lc=dow===0?'day-label sun':dow===6?'day-label sat':'day-label';
    const row=document.createElement('div'); row.className='day-row';
    row.innerHTML=`
      <div class="${lc}">${fmtDate(date)}<br>（${WEEKDAYS[dow]}）</div>
      <div class="time-wrap">
        <div class="time-label">開始</div>
        <input class="time-input" type="text" id="start_${i}" placeholder="09:00">
      </div>
      <div class="time-wrap">
        <div class="time-label">終了</div>
        <input class="time-input" type="text" id="end_${i}" placeholder="17:00">
      </div>
      <div class="time-wrap">
        <div class="time-label">状態</div>
        <button class="state-btn" id="state_${i}" onclick="toggleState(${i})">-</button>
      </div>`;
    c.appendChild(row);
  }
}
async function sendShift() {
  const userName=document.getElementById('userName').value.trim();
  if (!userName) { alert('お名前を入力してください'); return; }
  const entries=[];
  for (let i=0;i<7;i++) {
    const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
    const isHoliday=document.getElementById('state_'+i).classList.contains('holiday');
    const s=document.getElementById('start_'+i).value.trim();
    const e=document.getElementById('end_'+i).value.trim();
    if (isHoliday) { entries.push({date:fmtFull(date),shift:'休み'}); }
    else if (s && e) { entries.push({date:fmtFull(date),shift:s+'〜'+e}); }
  }
  if (entries.length===0) { alert('少なくとも1日以上入力してください'); return; }
  const btn=document.querySelector('button.is-success');
  btn.disabled=true; btn.innerHTML='<strong>送信中...</strong>';
  try {
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({type:'shiftNew',userName,entries,note:document.getElementById('note').value})});
    if (res.ok) { alert('申請が完了しました！'); document.getElementById('note').value=''; renderRows(); }
    else throw new Error('サーバーエラー: '+res.status);
  } catch(err) { alert('エラー: '+err); }
  finally { btn.disabled=false; btn.innerHTML='<strong>この内容で申請する</strong>'; }
}
</script>
</body>
</html>
