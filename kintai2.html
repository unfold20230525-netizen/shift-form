<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠打刻</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16324F;
    --navy-hover: #1E4468;
    --navy-active: #0F2438;
    --sky: #4FA3D1;
    --sky-dark: #3A87B5;
    --sky-bg: #EAF4FA;
    --sky-border: #B9DDEE;
    --beige: #F5F0E6;
    --white: #FFFFFF;
    --gray-100: #F7F6F3;
    --gray-200: #E7E3DA;
    --gray-300: #D8D3C8;
    --gray-500: #8A8A85;
    --gray-700: #5B5B57;
    --text-main: #2B2B28;
    --text-body: #2B2B28;
    --disabled-bg: #D8D3C8;
    --disabled-text: #8A8A85;
    --success-bg: #E7F2EA; --success-text: #2F6B46; --success-border: #A9D2B5;
    --info-bg: #EAF4FA;    --info-text: #1B6C93;    --info-border: #B9DDEE;
    --warning-bg: #FBF1E3; --warning-text: #8A5A1E; --warning-border: #EBD3AC;
    --error-bg: #FBEAEA;   --error-text: #B3261E;   --error-border: #E9B7B4;
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
    --shadow-card: 0 4px 24px rgba(22,50,79,0.08);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background: var(--beige);
    color: var(--text-body);
    padding: 20px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
 
  .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .auth-card {
    background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem;
    width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-card);
    animation: fadeIn .3s ease-out;
  }
  .auth-icon {
    width: 60px; height: 60px; border-radius: 50%; background: var(--sky-bg);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    margin: 0 auto 1rem;
  }
  .auth-card h2 { color: var(--navy); font-weight: 700; margin-bottom: 0.35rem; font-size: 1.3rem; }
  .brand-tag {
    display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--sky-dark);
    font-weight: 700; margin-bottom: 1rem; text-transform: uppercase;
  }
  .auth-card p.lead { color: var(--gray-700); font-size: 13px; margin-bottom: 1.5rem; }
 
  .input {
    background: var(--white); border: 1px solid var(--gray-300); border-radius: 8px;
    font-size: 16px; height: auto; padding: 12px 14px; color: var(--text-main);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input::placeholder { color: var(--gray-500); }
  .input:focus {
    border-color: var(--sky); box-shadow: 0 0 0 3px rgba(79,163,209,0.18); outline: none;
  }
 
  .button.is-info {
    background: var(--navy); border: none; font-weight: 700; border-radius: var(--radius-sm);
    height: auto; padding: 13px 14px; font-size: 15px; transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .button.is-info:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
  .button.is-info:active { background: var(--navy-active); transform: translateY(0) scale(0.99); box-shadow: none; }
  .button.is-info[disabled] { background: var(--disabled-bg); color: var(--disabled-text); }
 
  #authError {
    background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text) !important;
    border-radius: 8px; padding: 8px 10px; text-align: left;
  }
 
  #mainContent { max-width: 420px; margin: 0 auto; animation: fadeIn .3s ease-out; }
 
  .user-info { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 13px; color: var(--gray-700); margin-bottom: 14px; }
  .logout-btn {
    font-size: 12px; color: var(--navy); background: var(--white); border: 1px solid var(--gray-300);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: background-color .15s ease;
  }
  .logout-btn:hover { background: var(--sky-bg); border-color: var(--sky); }
 
  .page-title { text-align: center; margin-bottom: 20px; }
  .page-title h1 { color: var(--navy); font-weight: 900; font-size: 1.4rem; margin-bottom: 4px; }
  .page-title .brand-tag { margin-bottom: 0; }
  .title-rule { width: 40px; height: 3px; background: var(--sky); border-radius: 2px; margin: 10px auto 0; }
 
  .status-box {
    background: var(--white); border-radius: var(--radius-md); padding: 18px 15px;
    margin-bottom: 16px; text-align: center; box-shadow: var(--shadow-card);
    border-left: 4px solid var(--navy);
  }
  .status-box .status-label { font-size: 12px; color: var(--gray-700); margin-bottom: 6px; letter-spacing: .02em; }
  .status-text { font-size: 16px; font-weight: 700; color: var(--navy); }
 
  .error-box {
    background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 8px;
    padding: 12px; margin-bottom: 12px; color: var(--error-text); font-size: 13px; display: none;
    white-space: pre-line;
  }
  .success-box {
    background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 8px;
    padding: 12px; margin-bottom: 12px; color: var(--success-text); font-size: 13px; display: none;
    white-space: pre-line;
  }
 
  .btn-kintai {
    width: 100%; min-height: 60px; padding: 16px 18px; font-size: 16px; font-weight: 700;
    border-radius: var(--radius-md); border: none; cursor: pointer; margin-bottom: 12px; color: white;
    box-shadow: 0 2px 6px rgba(22,58,95,0.10);
    transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    letter-spacing: 0.02em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-kintai:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(22,58,95,0.16); }
  .btn-kintai:active:not(:disabled) { transform: translateY(0) scale(0.98); box-shadow: 0 1px 3px rgba(22,58,95,0.12); }
  .btn-syukkin       { background: #4C8C6B; }
  .btn-syukkin:hover       { background: #578F6F; }
  .btn-syukkin:active      { background: #3F7358; }
  .btn-taikin        { background: #A9524B; }
  .btn-taikin:hover        { background: #B15D56; }
  .btn-taikin:active       { background: #8F423C; }
  .btn-kyukei-start  { background: #C08A3E; }
  .btn-kyukei-start:hover  { background: #C79549; }
  .btn-kyukei-start:active { background: #A9762F; }
  .btn-kyukei-end    { background: var(--sky); }
  .btn-kyukei-end:hover    { background: #5CACDB; }
  .btn-kyukei-end:active   { background: var(--sky-dark); }
  .btn-kintai:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; box-shadow: none; }
 
  .footnote { font-size: 11px; color: var(--gray-500); text-align: center; margin-top: 15px; }
</style>
</head>
<body>
  <!-- 認証画面 -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-icon">🕐</div>
      <span class="brand-tag">ATTENDANCE MANAGEMENT</span>
      <h2>勤怠打刻</h2>
      <p class="lead">お名前と電話番号を入力してください</p>
      <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
      <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
      <div id="authError" style="font-size:13px;margin-bottom:0.5rem;display:none">
        名前または電話番号が一致しません。
      </div>
      <button class="button is-info is-fullwidth" onclick="checkAuth()">ログイン</button>
    </div>
  </div>
  <!-- メインコンテンツ -->
  <div id="mainContent" style="display:none">
    <div class="user-info">
      <span id="displayName"></span>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
    <div class="page-title">
      <span class="brand-tag">勤怠管理システム</span>
      <h1>勤怠打刻</h1>
      <div class="title-rule"></div>
    </div>
    <div class="status-box">
      <div class="status-label">現在の状態</div>
      <div class="status-text" id="currentStatus">確認中...</div>
    </div>
    <div id="errorBox" class="error-box"></div>
    <div id="successBox" class="success-box"></div>
    <button class="btn-kintai btn-syukkin" id="btnSyukkin" onclick="doPunch('出勤')">
      出勤
    </button>
    <button class="btn-kintai btn-kyukei-start" id="btnKyukeiStart" onclick="doPunch('休憩開始')">
      休憩開始
    </button>
    <button class="btn-kintai btn-kyukei-end" id="btnKyukeiEnd" onclick="doPunch('休憩終了')">
      休憩終了
    </button>
    <button class="btn-kintai btn-taikin" id="btnTaikin" onclick="doPunch('退勤')">
      退勤
    </button>
    <p class="footnote">
      ※打刻時に位置情報を記録します。
    </p>
  </div>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
    const MIN_INTERVAL = 5 * 60 * 1000; // 5分
    let currentUser = null;
    // =============================================
    // 30分丸め関数
    // 開始系（出勤・休憩終了）→ 切り上げ
    // 終了系（退勤・休憩開始）→ 切り捨て
    // =============================================
    function roundTime(date, type) {
      const isStart = (type === '出勤' || type === '休憩終了');
      const minutes = date.getMinutes();
      const roundedMinutes = isStart
        ? Math.ceil(minutes / 30) * 30
        : Math.floor(minutes / 30) * 30;
      const result = new Date(date);
      result.setSeconds(0);
      result.setMilliseconds(0);
      if (roundedMinutes === 60) {
        result.setMinutes(0);
        result.setHours(date.getHours() + 1);
      } else {
        result.setMinutes(roundedMinutes);
      }
      return result;
    }
    function formatTime(date) {
      return date.getHours() + ':' + String(date.getMinutes()).padStart(2, '0');
    }
    // 起動時にlocalStorageを確認
    window.onload = function() {
      const saved = localStorage.getItem('kintaiUser');
      if (saved) {
        const data = JSON.parse(saved);
        const now = new Date().getTime();
        if (now - data.loginTime < 24 * 60 * 60 * 1000) {
          currentUser = data;
          showMain();
          return;
        } else {
          localStorage.removeItem('kintaiUser');
        }
      }
      document.getElementById('authScreen').style.display = 'flex';
    };
    async function checkAuth() {
      const name = document.getElementById('authName').value.trim();
      const tel  = document.getElementById('authTel').value.trim();
      if (!name) { alert('お名前を入力してください'); return; }
      if (!tel)  { alert('電話番号を入力してください'); return; }
      const btn = document.querySelector('#authScreen button');
      btn.disabled = true;
      btn.textContent = '確認中...';
      try {
        const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
        const data = await res.json();
        if (data.auth) {
          currentUser = { name, tel, loginTime: new Date().getTime() };
          localStorage.setItem('kintaiUser', JSON.stringify(currentUser));
          showMain();
        } else {
          document.getElementById('authError').style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'ログイン';
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    }
    function showMain() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('displayName').textContent = currentUser.name + ' さん';
      updateStatus();
    }
    function logout() {
      localStorage.removeItem('kintaiUser');
      currentUser = null;
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
    }
    function updateStatus() {
      const lastPunch = localStorage.getItem('lastPunch_' + currentUser.name);
      const statusEl  = document.getElementById('currentStatus');
      if (lastPunch) {
        const data = JSON.parse(lastPunch);
        statusEl.innerHTML = `${data.type}（実打刻：${data.actualTime} → 記録：${data.roundedTime}）`;
      } else {
        statusEl.textContent = '未打刻';
      }
      updateButtons();
    }
    function updateButtons() {
      const lastPunch = localStorage.getItem('lastPunch_' + currentUser.name);
      const type = lastPunch ? JSON.parse(lastPunch).type : '';
      document.getElementById('btnSyukkin').disabled     = (type === '出勤' || type === '休憩開始' || type === '休憩終了');
      document.getElementById('btnKyukeiStart').disabled = (type !== '出勤' && type !== '休憩終了');
      document.getElementById('btnKyukeiEnd').disabled   = (type !== '休憩開始');
      document.getElementById('btnTaikin').disabled      = (type !== '出勤' && type !== '休憩終了');
    }
    function showError(msg) {
      const el = document.getElementById('errorBox');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
      document.getElementById('successBox').style.display = 'none';
      if (msg) setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
    function showSuccess(msg) {
      const el = document.getElementById('successBox');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorBox').style.display = 'none';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
    async function doPunch(type) {
      // 連続打刻チェック
      const lastPunch = localStorage.getItem('lastPunch_' + currentUser.name);
      if (lastPunch) {
        const data = JSON.parse(lastPunch);
        const diff = new Date().getTime() - data.timestamp;
        if (diff < MIN_INTERVAL) {
          const remaining = Math.ceil((MIN_INTERVAL - diff) / 1000 / 60);
          showError(`前回の打刻から${remaining}分後に打刻できます`);
          return;
        }
      }
      // ボタンを無効化
      const buttons = document.querySelectorAll('.btn-kintai');
      buttons.forEach(b => b.disabled = true);
      showError('');
      document.getElementById('currentStatus').textContent = '位置情報を取得中...';
      // 位置情報取得（記録用のみ・距離チェックは行わない）
      if (!navigator.geolocation) {
        // 位置情報が使えない場合も打刻は継続する
        await submitPunch(type, null, null, null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat      = position.coords.latitude;
          const lng      = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          await submitPunch(type, lat, lng, accuracy);
        },
        async (error) => {
          // 位置情報取得に失敗しても打刻は継続する
          console.log('位置情報取得失敗: ' + error.message);
          await submitPunch(type, null, null, null);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
    async function submitPunch(type, lat, lng, accuracy) {
      try {
        const now = new Date();
        const actualTime  = formatTime(now);
        const rounded     = roundTime(now, type);
        const roundedTime = formatTime(rounded);
        // 逆ジオコーディングで住所取得（位置情報が取得できた場合のみ）
        let address = '';
        let zip = '';
        if (lat !== null && lng !== null) {
          try {
            const geoRes = await fetch(
              `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`,
              { headers: { 'User-Agent': 'UNFOLD-kintai-app' } }
            );
            const geoData = await geoRes.json();
            if (geoData && geoData.address) {
              const a = geoData.address;
              zip = a.postcode || '';
              address = (a.province || '') + (a.city || '') + (a.suburb || '') + (a.neighbourhood || '') + (a.road || '') + (a.house_number || '');
            }
          } catch(e) {
            console.log('住所取得失敗:', e);
          }
        }
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'kintaiRequest',
            userName: currentUser.name,
            punchType: type,
            latitude: lat,
            longitude: lng,
            accuracy: accuracy !== null ? Math.round(accuracy) : '',
            address: address,
            zip: zip,
            actualTime: actualTime,
            roundedTime: roundedTime
          })
        });
        if (res.ok) {
          const punchData = {
            type: type,
            actualTime: actualTime,
            roundedTime: roundedTime,
            timestamp: now.getTime()
          };
          localStorage.setItem('lastPunch_' + currentUser.name, JSON.stringify(punchData));
          showSuccess(`【${type}】を記録しました！\n実打刻：${actualTime} → 記録時間：${roundedTime}`);
          updateStatus();
        } else {
          showError('送信に失敗しました。再度お試しください。');
          updateStatus();
        }
      } catch(err) {
        showError('通信エラーが発生しました: ' + err);
        updateStatus();
      }
    }
  </script>
</body>
</html>
