<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠修正申請</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    body { padding: 15px; background: #f5f5f5; }
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
    .user-info { text-align: right; font-size: 13px; color: #888; margin-bottom: 10px; }
    .logout-btn { font-size: 12px; color: #888; background: none; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 認証画面 -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div style="font-size:40px;margin-bottom:1rem">🔐</div>
      <h2 style="font-weight:bold;margin-bottom:0.5rem">スタッフ認証</h2>
      <p style="color:#888;font-size:13px;margin-bottom:1.5rem">お名前と電話番号を入力してください</p>
      <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
      <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
      <div id="authError" style="color:red;font-size:13px;margin-bottom:0.5rem;display:none">
        名前または電話番号が一致しません。
      </div>
      <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
    </div>
  </div>

  <!-- メインコンテンツ（認証後に表示） -->
  <div id="mainContent" style="display:none">
    <div class="user-info">
      <span id="displayName"></span>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
    <div class="card">
      <div class="card-content">
        <h2 style="font-weight:bold;text-align:center;margin-bottom:20px">📝 勤怠修正申請フォーム</h2>

        <div class="field">
          <label class="label">お名前</label>
          <input class="input" type="text" id="userName" readonly style="background:#f5f5f5">
        </div>

        <div class="field">
          <label class="label">勤務日</label>
          <input class="input" type="date" id="workDate" required>
        </div>

        <div class="field">
          <label class="label">修正種別</label>
          <div class="select is-fullwidth">
            <select id="correctionType" onchange="updateTimeField()">
              <option value="出勤時間">出勤時間</option>
              <option value="退勤時間">退勤時間</option>
              <option value="勤務日">勤務日</option>
            </select>
          </div>
        </div>

        <div class="field" id="timeField">
          <label class="label">修正後の時間</label>
          <input class="input" type="time" id="correctionTime">
        </div>

        <div class="field" id="dateField" style="display:none">
          <label class="label">修正後の勤務日</label>
          <input class="input" type="date" id="correctionDate">
        </div>

        <div class="field">
          <label class="label">修正前の時間・日付</label>
          <input class="input" type="text" id="beforeValue" placeholder="例：9:00 または 2026/05/01">
        </div>

        <div class="field">
          <label class="label">理由</label>
          <textarea class="textarea" id="reason" rows="3" placeholder="例：打刻忘れのため"></textarea>
        </div>

        <button class="button is-warning is-fullwidth is-large" style="margin-top:10px" onclick="sendCorrection()">
          <strong>この内容で申請する</strong>
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";

    window.onload = function() {
      const saved = localStorage.getItem('kintaiUser');
      if (saved) {
        const data = JSON.parse(saved);
        const now = new Date().getTime();
        if (now - data.loginTime < 24 * 60 * 60 * 1000) {
          showMain(data.name);
          return;
        } else {
          localStorage.removeItem('kintaiUser');
        }
      }
      document.getElementById('authScreen').style.display = 'flex';
    };

    function logout() {
      localStorage.removeItem('kintaiUser');
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
    }

    async function checkAuth() {
      const name = document.getElementById('authName').value.trim();
      const tel  = document.getElementById('authTel').value.trim();
      if (!name) { alert('お名前を入力してください'); return; }
      if (!tel)  { alert('電話番号を入力してください'); return; }

      const btn = document.querySelector('#authScreen button');
      btn.disabled = true;
      btn.textContent = '確認中...';

      try {
        const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
        const data = await res.json();
        if (data.auth) {
          localStorage.setItem('kintaiUser', JSON.stringify({ name, tel, loginTime: new Date().getTime() }));
          showMain(name);
        } else {
          document.getElementById('authError').style.display = 'block';
          btn.disabled = false;
          btn.textContent = '確認する';
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
        btn.disabled = false;
        btn.textContent = '確認する';
      }
    }

    function showMain(name) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('userName').value = name;
      document.getElementById('displayName').textContent = name + ' さん';
    }

    function updateTimeField() {
      const type = document.getElementById('correctionType').value;
      if (type === '勤務日') {
        document.getElementById('timeField').style.display = 'none';
        document.getElementById('dateField').style.display = 'block';
      } else {
        document.getElementById('timeField').style.display = 'block';
        document.getElementById('dateField').style.display = 'none';
      }
    }

    async function sendCorrection() {
      const userName       = document.getElementById('userName').value.trim();
      const workDate       = document.getElementById('workDate').value;
      const correctionType = document.getElementById('correctionType').value;
      const beforeValue    = document.getElementById('beforeValue').value.trim();
      const reason         = document.getElementById('reason').value.trim();

      let afterValue = '';
      if (correctionType === '勤務日') {
        afterValue = document.getElementById('correctionDate').value;
      } else {
        afterValue = document.getElementById('correctionTime').value;
      }

      if (!workDate)    { alert('勤務日を選択してください'); return; }
      if (!afterValue)  { alert('修正後の時間・日付を入力してください'); return; }
      if (!beforeValue) { alert('修正前の時間・日付を入力してください'); return; }
      if (!reason)      { alert('理由を入力してください'); return; }

      const btn = document.querySelector('button.is-warning');
      btn.disabled = true;
      btn.innerHTML = '<strong>送信中...</strong>';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'correctionRequest',
            userName, workDate, correctionType, beforeValue, afterValue, reason
          })
        });
        if (res.ok) {
          alert('申請が完了しました！\n管理者の承認後に修正されます。');
          document.getElementById('reason').value = '';
          document.getElementById('beforeValue').value = '';
        } else {
          throw new Error('サーバーエラー: ' + res.status);
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<strong>この内容で申請する</strong>';
      }
    }
  </script>
</body>
</html>
