<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフトカレンダー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #16324F; --navy-hover: #1E4468; --navy-active: #0F2438;
      --sky: #4FA3D1; --sky-dark: #3A87B5; --sky-bg: #EAF4FA; --sky-border: #B9DDEE;
      --beige: #F5F0E6; --white: #FFFFFF;
      --gray-100: #F7F6F3; --gray-200: #E7E3DA; --gray-300: #D8D3C8;
      --gray-500: #8A8A85; --gray-700: #5B5B57; --text-main: #2B2B28; --text-body: #2B2B28;
      --disabled-bg: #D8D3C8; --disabled-text: #8A8A85;
      --success-bg: #E7F2EA; --success-text: #2F6B46; --success-border: #A9D2B5;
      --info-bg: #EAF4FA;    --info-text: #1B6C93;    --info-border: #B9DDEE;
      --amber-bg: #FBF1E3;   --amber-text: #8A5A1E;   --amber-border: #EBD3AC;
      --error-bg: #FBEAEA;   --error-text: #B3261E;   --error-border: #E9B7B4;
      --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
      --shadow-card: 0 4px 24px rgba(22,50,79,0.08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--beige); color: var(--text-body); padding: 20px 16px 40px; -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
 
    .wrap { max-width: 680px; margin: 0 auto; animation: fadeIn .3s ease-out; }
 
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 100%;
      max-width: 400px; text-align: center; box-shadow: var(--shadow-card); animation: fadeIn .3s ease-out;
    }
    .auth-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--sky-bg); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 1rem; }
    .auth-card h2 { color: var(--navy); font-weight: 700; margin-bottom: 0.35rem; font-size: 1.3rem; }
    .brand-tag { display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--sky-dark); font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; }
    .auth-card p.lead { color: var(--gray-700); font-size: 13px; margin-bottom: 1.5rem; }
    #authError { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text) !important; border-radius: 8px; padding: 8px 10px; }
    .input {
      background: var(--white); border: 1px solid var(--gray-300); border-radius: 8px; font-size: 16px;
      padding: 12px 14px; color: var(--text-main); transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder { color: var(--gray-500); }
    .input:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(79,163,209,0.18); outline: none; }
    .button.is-info {
      background: var(--navy); border: none; font-weight: 700; border-radius: var(--radius-sm); height: auto;
      padding: 13px 14px; font-size: 15px; transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .button.is-info:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
    .button.is-info:active { background: var(--navy-active); transform: translateY(0) scale(0.99); box-shadow: none; }
 
    .user-info { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 13px; color: var(--gray-700); margin-bottom: 10px; }
    .logout-btn {
      font-size: 12px; color: var(--navy); background: var(--white); border: 1px solid var(--gray-300);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: background-color .15s ease;
    }
    .logout-btn:hover { background: var(--sky-bg); border-color: var(--sky); }
 
    .page-title { text-align: center; margin-bottom: 20px; }
    .page-title .brand-tag { margin-bottom: 4px; }
    .page-title h2 { color: var(--navy); font-weight: 900; font-size: 1.3rem; }
    .title-rule { width: 40px; height: 3px; background: var(--sky); border-radius: 2px; margin: 10px auto 0; }
 
    .view-toggle { display: flex; gap: 8px; margin-bottom: 1.2rem; justify-content: center; }
    .view-btn {
      border: 1px solid var(--navy); background: var(--white); color: var(--navy); border-radius: var(--radius-sm);
      padding: 8px 20px; font-size: 14px; cursor: pointer; transition: background-color .15s ease, color .15s ease, transform .1s ease;
    }
    .view-btn:hover { background: var(--sky-bg); transform: translateY(-1px); }
    .view-btn:active { transform: translateY(0) scale(0.98); }
    .view-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
 
    .legend {
      display: flex; gap: 14px; margin-bottom: 1.2rem; flex-wrap: wrap; justify-content: center;
      background: var(--white); border-radius: var(--radius-md); padding: 10px 14px; box-shadow: var(--shadow-card);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--gray-700); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
 
    /* 一括確認ボタン */
    .bulk-confirm-wrap { margin-bottom: 1.2rem; text-align: center; }
    .bulk-confirm-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #4C8C6B; color: white; border: none; border-radius: var(--radius-sm);
      padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 46px;
      box-shadow: var(--shadow-card); transition: background-color .15s ease, transform .1s ease;
    }
    .bulk-confirm-btn:hover { background: #578F6F; transform: translateY(-1px); }
    .bulk-confirm-btn:active { background: #3F7358; transform: translateY(0) scale(0.99); }
    .bulk-confirm-btn:disabled { background: var(--disabled-bg); color: var(--disabled-text); }
 
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-title { font-size: 16px; font-weight: 700; color: var(--navy); }
    .nav-btn {
      border: none; background: var(--navy); color: white; border-radius: 50%; width: 34px; height: 34px;
      font-size: 15px; cursor: pointer; transition: background-color .15s ease, transform .1s ease;
    }
    .nav-btn:hover { background: var(--sky-dark); transform: translateY(-1px); }
    .nav-btn:active { transform: translateY(0) scale(0.95); }
 
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--gray-700); padding: 4px 0; font-weight: 700; }
    .cal-dow.sun { color: #B3453D; }
    .cal-dow.sat { color: var(--sky-dark); }
    .cal-day { min-height: 78px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 6px 5px; background: var(--white); box-shadow: 0 1px 4px rgba(22,58,95,0.05); transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease; }
    .cal-day.other-month { background: var(--gray-100); opacity: 0.55; box-shadow: none; }
    .cal-day.today { border: 2px solid var(--navy); }
    .cal-day.has-shift { cursor: pointer; }
    .cal-day.has-shift:hover { border-color: var(--sky); box-shadow: 0 4px 12px rgba(79,175,224,0.18); }
    .cal-date { font-size: 11px; color: var(--gray-700); margin-bottom: 3px; }
    .cal-date.sun { color: #B3453D; }
    .cal-date.sat { color: var(--sky-dark); }
    .shift-badge { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 3px 4px; display: block; text-align: center; margin-bottom: 2px; }
    .status-badge { font-size: 9px; border-radius: 4px; padding: 1px 3px; display: block; text-align: center; }
 
    /* シフト色：時間帯ごとに色分け（元のデザインの配色ルールを、より明るいトーンで維持） */
    .s-hayaban { background: var(--sky-bg); color: var(--navy); }
    .s-nakaban { background: #E7F8ED; color: #1E8E4F; }
    .s-ossoban { background: #FCF0DC; color: #9A6B00; }
    .s-yasumi  { background: var(--white); color: var(--gray-700); border: 1px solid var(--gray-200); }
    .s-custom  { background: #F1E9FB; color: #6B3FA0; }
 
    /* ステータス色 */
    .st-pending  { background: var(--amber-bg); color: var(--amber-text); }
    .st-confirm  { background: var(--success-bg); color: var(--success-text); }
    .st-cancel   { background: var(--error-bg); color: var(--error-text); }
    .st-revised  { background: var(--info-bg); color: var(--info-text); }
 
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day-card { border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 10px 6px; background: var(--white); box-shadow: 0 1px 4px rgba(22,58,95,0.05); min-height: 104px; transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease; }
    .day-card.today { border: 2px solid var(--navy); }
    .day-card.has-shift { cursor: pointer; }
    .day-card.has-shift:hover { border-color: var(--sky); box-shadow: 0 4px 12px rgba(79,175,224,0.18); }
    .day-name { font-size: 11px; color: var(--gray-700); text-align: center; margin-bottom: 2px; }
    .day-name.sun { color: #B3453D; }
    .day-name.sat { color: var(--sky-dark); }
    .day-num { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 6px; color: var(--text-main); }
    .day-num.sun { color: #B3453D; }
    .day-num.sat { color: var(--sky-dark); }
    .today-circle { background: var(--navy); color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 13px; font-weight: 700; }
    .shift-block { border-radius: 5px; padding: 4px; font-size: 12px; font-weight: 700; text-align: center; }
    .no-shift { font-size: 11px; color: var(--gray-500); text-align: center; margin-top: 6px; }
    .loading { text-align: center; padding: 2rem; color: var(--gray-500); }
 
    /* 詳細オーバーレイ */
    .detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(22,50,79,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .detail-card { background: var(--white); border-radius: var(--radius-lg); padding: 1.6rem; width: 320px; max-width: 100%; box-shadow: var(--shadow-card); animation: fadeIn .2s ease-out; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .detail-title { font-size: 16px; font-weight: 700; color: var(--navy); }
    .detail-close { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--gray-500); line-height: 1; }
    .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-200); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 13px; color: var(--gray-700); width: 80px; flex-shrink: 0; }
    .detail-value { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .detail-badge { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 4px 10px; }
 
    /* 了解ボタン */
    .confirm-btn {
      width: 100%; padding: 13px; font-size: 15px; font-weight: 700; border-radius: var(--radius-sm); border: none;
      cursor: pointer; background: #4C8C6B; color: white; margin-top: 10px; min-height: 48px;
      transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .confirm-btn:hover { background: #578F6F; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(76,140,107,0.2); }
    .confirm-btn:active { background: #3F7358; transform: translateY(0) scale(0.99); box-shadow: none; }
    .confirm-btn:disabled { background: var(--disabled-bg); color: var(--disabled-text); }
    .confirmed-mark { text-align: center; padding: 10px; font-size: 14px; color: var(--success-text); font-weight: 700; background: var(--success-bg); border-radius: 8px; margin-top: 10px; }
 
    /* キャンセルボタン（一括確認ポップアップ用） */
    .cancel-btn {
      width: 100%; padding: 13px; font-size: 15px; font-weight: 700; border-radius: var(--radius-sm);
      border: 1px solid var(--gray-300); cursor: pointer; background: var(--white); color: var(--gray-700);
      transition: background-color .15s ease;
    }
    .cancel-btn:hover { background: var(--gray-100); }
    .bulk-warning { font-size: 13px; color: var(--error-text); font-weight: 700; margin-top: 6px; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn-row > * { flex: 1; margin-top: 0; }
 
    /* ===== モバイル対応（Android / iPhone） ===== */
    @media (max-width: 480px) {
      body { padding: 14px 8px 30px; }
      .page-title h2 { font-size: 1.15rem; }
      .view-btn { padding: 7px 16px; font-size: 13px; }
      .legend { gap: 8px; padding: 8px 10px; }
      .legend-item { font-size: 10.5px; }
      .legend-dot { width: 9px; height: 9px; }
      .bulk-confirm-btn { font-size: 13px; padding: 11px 14px; width: 100%; }
      .cal-title { font-size: 14px; }
      .nav-btn { width: 30px; height: 30px; font-size: 13px; }
      .cal-grid { gap: 4px; }
      .cal-dow { font-size: 10px; padding: 3px 0; }
      .cal-day { min-height: 64px; padding: 4px 3px; border-radius: 8px; }
      .cal-date { font-size: 9.5px; margin-bottom: 2px; }
      .shift-badge { font-size: 9px; padding: 2px 2px; margin-bottom: 1px; border-radius: 4px; }
      .status-badge { font-size: 7.5px; padding: 1px 2px; }
      .week-grid { gap: 4px; }
      .day-card { min-height: 92px; padding: 7px 3px; }
      .day-name { font-size: 9.5px; }
      .day-num { font-size: 13px; margin-bottom: 4px; }
      .today-circle { width: 22px; height: 22px; font-size: 11px; margin-bottom: 4px; }
      .shift-block { font-size: 10.5px; padding: 3px; }
      .no-shift { font-size: 9.5px; }
      .detail-card { padding: 1.3rem; }
    }
    @media (max-width: 360px) {
      .cal-grid { gap: 3px; }
      .cal-day { min-height: 58px; padding: 3px 2px; }
      .cal-date { font-size: 9px; }
      .shift-badge { font-size: 8px; }
      .status-badge { font-size: 7px; }
      .day-card { min-height: 84px; padding: 6px 2px; }
      .shift-block { font-size: 9.5px; }
    }
  </style>
</head>
<body>
  <!-- 認証画面 -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="auth-icon">🔐</div>
      <span class="brand-tag">ATTENDANCE MANAGEMENT</span>
      <h2>スタッフ認証</h2>
      <p class="lead">お名前と電話番号を入力してください</p>
      <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
      <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
      <div id="authError" style="font-size:13px;margin-bottom:0.5rem;display:none">
        名前または電話番号が一致しません。
      </div>
      <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
    </div>
  </div>
  <!-- メインコンテンツ -->
  <div id="mainContent" style="display:none">
    <div class="wrap">
      <div class="user-info">
        <span id="displayName"></span>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
      <div class="page-title">
        <span class="brand-tag">勤怠管理システム</span>
        <h2>シフトカレンダー</h2>
        <div class="title-rule"></div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="btnMonth" onclick="setView('month')">月表示</button>
        <button class="view-btn" id="btnWeek" onclick="setView('week')">週表示</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#FBF1E3;border:1px solid #8A5A1E"></div>申請中</div>
        <div class="legend-item"><div class="legend-dot" style="background:#E7F2EA;border:1px solid #2F6B46"></div>確定</div>
        <div class="legend-item"><div class="legend-dot" style="background:#EAF4FA;border:1px solid #1B6C93"></div>時間修正確定</div>
        <div class="legend-item"><div class="legend-dot" style="background:#FBEAEA;border:1px solid #B3261E"></div>キャンセル</div>
      </div>
      <!-- 一括確認ボタン（未確認のシフトがある場合のみ表示） -->
      <div id="bulkConfirmArea" class="bulk-confirm-wrap" style="display:none">
        <button class="bulk-confirm-btn" id="bulkConfirmBtn" onclick="openBulkConfirm()">
          👍 未確認シフトをまとめて確認する（<span id="bulkCount">0</span>件）
        </button>
      </div>
      <div class="cal-header">
        <button class="nav-btn" onclick="changePeriod(-1)">＜</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="nav-btn" onclick="changePeriod(1)">＞</button>
      </div>
      <div id="calDow" class="cal-grid">
        <div class="cal-dow sun">日</div>
        <div class="cal-dow">月</div>
        <div class="cal-dow">火</div>
        <div class="cal-dow">水</div>
        <div class="cal-dow">木</div>
        <div class="cal-dow">金</div>
        <div class="cal-dow sat">土</div>
      </div>
      <div id="mainGrid"></div>
      <div id="loadingMsg" class="loading" style="display:none">読み込み中...</div>
    </div>
  </div>
  <!-- 詳細オーバーレイ -->
  <div id="detailOverlay" class="detail-overlay" style="display:none;" onclick="closeDetail(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
      <div class="detail-header">
        <div class="detail-title">シフト詳細</div>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-row">
        <div class="detail-label">勤務日</div>
        <div class="detail-value" id="detailDate"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">シフト</div>
        <div id="detailShift"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">ステータス</div>
        <div id="detailStatus"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">担当者</div>
        <div class="detail-value" id="detailName"></div>
      </div>
      <!-- 了解ボタン or 確認済みマーク -->
      <div id="detailConfirmArea"></div>
    </div>
  </div>
  <!-- 一括確認 確認ポップアップ -->
  <div id="bulkOverlay" class="detail-overlay" style="display:none;" onclick="closeBulkOverlay(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
      <div class="detail-header">
        <div class="detail-title">一括確認</div>
        <button class="detail-close" onclick="closeBulkOverlay()">✕</button>
      </div>
      <p style="font-size:14px; line-height:1.7; color:var(--text-main); margin:4px 0 0;">
        未確認のシフト <strong id="bulkOverlayCount">0</strong>件を、まとめて「了解しました」にします。
      </p>
      <p class="bulk-warning">お間違いないですか？</p>
      <div class="btn-row">
        <button class="cancel-btn" onclick="closeBulkOverlay()">キャンセル</button>
        <button class="confirm-btn" id="bulkExecBtn" onclick="executeBulkConfirm()">実行する</button>
      </div>
    </div>
  </div>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
    // ステータス定義
    // 0:未承認 1:確定 2:キャンセル 3:時間修正確定
    const STATUS_INFO = {
      0: { label: '申請中',     cls: 'st-pending' },
      1: { label: '確定',       cls: 'st-confirm' },
      2: { label: 'キャンセル', cls: 'st-cancel'  },
      3: { label: '時間修正確定', cls: 'st-revised' }
    };
    const DOWS   = ['日','月','火','水','木','金','土'];
    const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    let view = 'month';
    let currentYear  = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let weekStart    = getMonday(new Date());
    let shiftData    = {}; // key: "YYYY-MM-DD", value: { shift, status, revisedTime, staffConfirm, rowIndex }
    let currentName  = '';
    let currentDetailKey = null; // 詳細表示中のキー
    window.onload = function() {
      const saved = localStorage.getItem('kintaiUser');
      if (saved) {
        const data = JSON.parse(saved);
        const now  = new Date().getTime();
        if (now - data.loginTime < 24 * 60 * 60 * 1000) {
          showMain(data.name);
          return;
        } else {
          localStorage.removeItem('kintaiUser');
        }
      }
      document.getElementById('authScreen').style.display = 'flex';
    };
    function logout() {
      localStorage.removeItem('kintaiUser');
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
    }
    async function checkAuth() {
      const name = document.getElementById('authName').value.trim();
      const tel  = document.getElementById('authTel').value.trim();
      if (!name) { alert('お名前を入力してください'); return; }
      if (!tel)  { alert('電話番号を入力してください'); return; }
      const btn = document.querySelector('#authScreen button');
      btn.disabled    = true;
      btn.textContent = '確認中...';
      try {
        const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
        const data = await res.json();
        if (data.auth) {
          localStorage.setItem('kintaiUser', JSON.stringify({ name, tel, loginTime: new Date().getTime() }));
          showMain(name);
        } else {
          document.getElementById('authError').style.display = 'block';
          btn.disabled    = false;
          btn.textContent = '確認する';
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
        btn.disabled    = false;
        btn.textContent = '確認する';
      }
    }
    async function showMain(name) {
      currentName = name;
      document.getElementById('authScreen').style.display  = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('displayName').textContent   = name + ' さん';
      await loadShifts();
      render();
    }
    function getMonday(date) {
      const d   = new Date(date);
      const day = d.getDay();
      d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      d.setHours(0,0,0,0);
      return d;
    }
    function pad(n) { return String(n).padStart(2,'0'); }
    function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    async function loadShifts() {
      document.getElementById('loadingMsg').style.display  = 'block';
      document.getElementById('mainGrid').style.display    = 'none';
      try {
        const res  = await fetch(`${GAS_URL}?page=api&name=${encodeURIComponent(currentName)}`);
        const data = await res.json();
        shiftData  = {};
        for (const item of data) {
          shiftData[item.date] = {
            shift:        item.shift,
            status:       item.status       !== undefined ? Number(item.status) : 0,
            revisedTime:  item.revisedTime  || '',
            staffConfirm: item.staffConfirm !== undefined ? Number(item.staffConfirm) : 0,
            rowIndex:     item.rowIndex     !== undefined ? item.rowIndex : -1
          };
        }
      } catch(err) {
        console.error(err);
      } finally {
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('mainGrid').style.display   = '';
      }
    }
    function setView(v) {
      view = v;
      document.getElementById('btnMonth').className = 'view-btn' + (v === 'month' ? ' active' : '');
      document.getElementById('btnWeek').className  = 'view-btn' + (v === 'week'  ? ' active' : '');
      document.getElementById('calDow').style.display = v === 'month' ? 'grid' : 'none';
      render();
    }
    function changePeriod(delta) {
      if (view === 'month') {
        currentMonth += delta;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
      } else {
        weekStart.setDate(weekStart.getDate() + delta * 7);
      }
      render();
    }
    function render() {
      view === 'month' ? renderMonth() : renderWeek();
      updateBulkConfirmArea();
    }
    // ステータスに応じたバッジHTMLを返す
    function getStatusBadgeHtml(status, cls) {
      const info = STATUS_INFO[status] || STATUS_INFO[0];
      return `<span class="status-badge ${info.cls}">${info.label}</span>`;
    }
    // シフト表示用のラベルを取得（修正時間があれば修正後を優先）
    function getShiftLabel(data) {
      if ((data.status === 3) && data.revisedTime) return data.revisedTime;
      return data.shift;
    }
    // シフトの色クラスを取得
    function getShiftCls(shiftLabel) {
      if (shiftLabel.includes('09:00') || shiftLabel.includes('早番')) return 's-hayaban';
      if (shiftLabel.includes('12:00') || shiftLabel.includes('中番')) return 's-nakaban';
      if (shiftLabel.includes('13:00') || shiftLabel.includes('15:00') || shiftLabel.includes('遅番')) return 's-ossoban';
      if (shiftLabel.includes('休み')) return 's-yasumi';
      return 's-custom';
    }
    function openDetail(key) {
      const d = shiftData[key];
      if (!d) return;
      currentDetailKey = key;
      const date = new Date(key);
      const dow  = DOWS[date.getDay()];
      document.getElementById('detailDate').textContent = `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日（${dow}）`;
      const shiftLabel = getShiftLabel(d);
      const shiftCls   = getShiftCls(shiftLabel);
      document.getElementById('detailShift').innerHTML =
        `<span class="detail-badge ${shiftCls}">${shiftLabel}</span>` +
        (d.status === 3 && d.revisedTime ? `<div style="font-size:11px;color:#888;margin-top:4px">申請時：${d.shift}</div>` : '');
      const statusInfo = STATUS_INFO[d.status] || STATUS_INFO[0];
      document.getElementById('detailStatus').innerHTML =
        `<span class="detail-badge ${statusInfo.cls}">${statusInfo.label}</span>`;
      document.getElementById('detailName').textContent = currentName;
      // 了解ボタンエリア
      const confirmArea = document.getElementById('detailConfirmArea');
      if (d.status === 1 || d.status === 3) {
        // 確定 or 時間修正確定のとき
        if (d.staffConfirm === 1) {
          confirmArea.innerHTML = `<div class="confirmed-mark">✅ 確認済みです</div>`;
        } else {
          confirmArea.innerHTML = `<button class="confirm-btn" onclick="doConfirm('${key}')">👍 了解しました</button>`;
        }
      } else {
        confirmArea.innerHTML = '';
      }
      document.getElementById('detailOverlay').style.display = 'flex';
    }
    function closeDetail(event) {
      if (!event || event.target === document.getElementById('detailOverlay')) {
        document.getElementById('detailOverlay').style.display = 'none';
        currentDetailKey = null;
      }
    }
    // 了解ボタンを押したときの処理
    async function doConfirm(key) {
      const btn = document.querySelector('.confirm-btn');
      if (btn) { btn.disabled = true; btn.textContent = '送信中...'; }
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            type:     'shiftConfirm',
            userName: currentName,
            date:     key
          })
        });
        if (res.ok) {
          // ローカルのデータも更新
          if (shiftData[key]) shiftData[key].staffConfirm = 1;
          document.getElementById('detailConfirmArea').innerHTML =
            `<div class="confirmed-mark">✅ 確認済みです</div>`;
          render(); // カレンダーも再描画
        } else {
          alert('送信に失敗しました。再度お試しください。');
          if (btn) { btn.disabled = false; btn.textContent = '👍 了解しました'; }
        }
      } catch(err) {
        alert('通信エラー: ' + err);
        if (btn) { btn.disabled = false; btn.textContent = '👍 了解しました'; }
      }
    }
    // ===== 一括確認 =====
    // 確定 or 時間修正確定 かつ 未確認 のシフト一覧を返す
    function getUnconfirmedList() {
      return Object.keys(shiftData).filter(key => {
        const d = shiftData[key];
        return (d.status === 1 || d.status === 3) && d.staffConfirm !== 1;
      });
    }
    function updateBulkConfirmArea() {
      const list = getUnconfirmedList();
      const area = document.getElementById('bulkConfirmArea');
      document.getElementById('bulkCount').textContent = list.length;
      area.style.display = list.length > 0 ? 'block' : 'none';
    }
    function openBulkConfirm() {
      const list = getUnconfirmedList();
      if (list.length === 0) return;
      document.getElementById('bulkOverlayCount').textContent = list.length;
      document.getElementById('bulkOverlay').style.display = 'flex';
    }
    function closeBulkOverlay(event) {
      if (!event || event.target === document.getElementById('bulkOverlay')) {
        document.getElementById('bulkOverlay').style.display = 'none';
      }
    }
    // 「実行する」を押したときにまとめて了解済みにする
    async function executeBulkConfirm() {
      const list = getUnconfirmedList();
      if (list.length === 0) { closeBulkOverlay(); return; }
      const btn = document.getElementById('bulkExecBtn');
      btn.disabled = true;
      btn.textContent = '処理中...';
      let successCount = 0;
      for (const key of list) {
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ type: 'shiftConfirm', userName: currentName, date: key })
          });
          if (res.ok) {
            shiftData[key].staffConfirm = 1;
            successCount++;
          }
        } catch(err) {
          console.error(err);
        }
      }
      btn.disabled = false;
      btn.textContent = '実行する';
      document.getElementById('bulkOverlay').style.display = 'none';
      render();
      if (successCount === list.length) {
        alert(`${successCount}件のシフトを確認しました。`);
      } else {
        alert(`${successCount}/${list.length}件のシフトを確認しました。\n一部通信エラーが発生した可能性があります。`);
      }
    }
    function renderMonth() {
      document.getElementById('calTitle').textContent = `${currentYear}年${MONTHS[currentMonth]}`;
      const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();
      const today       = new Date(); today.setHours(0,0,0,0);
      const grid = document.getElementById('mainGrid');
      grid.className = 'cal-grid';
      grid.innerHTML = '';
      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day other-month';
        cell.innerHTML = `<div class="cal-date">${daysInPrev - firstDay + i + 1}</div>`;
        grid.appendChild(cell);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const date    = new Date(currentYear, currentMonth, d);
        const dow     = date.getDay();
        const key     = dateKey(date);
        const isToday = date.getTime() === today.getTime();
        const data    = shiftData[key];
        const cell = document.createElement('div');
        cell.className = 'cal-day' + (isToday ? ' today' : '') + (data ? ' has-shift' : '');
        if (data) cell.onclick = () => openDetail(key);
        const dateClass = dow === 0 ? 'cal-date sun' : dow === 6 ? 'cal-date sat' : 'cal-date';
        let html = `<div class="${dateClass}">${d}</div>`;
        if (data) {
          const shiftLabel = getShiftLabel(data);
          const shiftCls   = getShiftCls(shiftLabel);
          const statusInfo = STATUS_INFO[data.status] || STATUS_INFO[0];
          html += `<span class="shift-badge ${shiftCls}">${shiftLabel}</span>`;
          html += `<span class="status-badge ${statusInfo.cls}">${statusInfo.label}</span>`;
          // 確認済みマーク
          if ((data.status === 1 || data.status === 3) && data.staffConfirm === 1) {
            html += `<span style="font-size:9px;color:#2E7D32">✅確認済</span>`;
          }
        }
        cell.innerHTML = html;
        grid.appendChild(cell);
      }
      const remaining = 42 - firstDay - daysInMonth;
      for (let d = 1; d <= remaining; d++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day other-month';
        cell.innerHTML = `<div class="cal-date">${d}</div>`;
        grid.appendChild(cell);
      }
    }
    function renderWeek() {
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
      document.getElementById('calTitle').textContent = `${fmt(weekStart)}（月）〜${fmt(weekEnd)}（日）`;
      const today = new Date(); today.setHours(0,0,0,0);
      const grid  = document.getElementById('mainGrid');
      grid.className = 'week-grid';
      grid.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const date    = new Date(weekStart);
        date.setDate(weekStart.getDate() + i);
        const dow     = date.getDay();
        const key     = dateKey(date);
        const isToday = date.getTime() === today.getTime();
        const data    = shiftData[key];
        const card = document.createElement('div');
        card.className = 'day-card' + (isToday ? ' today' : '') + (data ? ' has-shift' : '');
        if (data) card.onclick = () => openDetail(key);
        const nameClass = dow === 0 ? 'day-name sun' : dow === 6 ? 'day-name sat' : 'day-name';
        const numClass  = dow === 0 ? 'day-num sun'  : dow === 6 ? 'day-num sat'  : 'day-num';
        let html = `<div class="${nameClass}">${DOWS[dow]}</div>`;
        html += isToday
          ? `<div class="today-circle">${date.getDate()}</div>`
          : `<div class="${numClass}">${date.getDate()}</div>`;
        if (data) {
          const shiftLabel = getShiftLabel(data);
          const shiftCls   = getShiftCls(shiftLabel);
          const statusInfo = STATUS_INFO[data.status] || STATUS_INFO[0];
          html += `<div class="shift-block ${shiftCls}">${shiftLabel}</div>`;
          html += `<span class="status-badge ${statusInfo.cls}" style="margin-top:3px">${statusInfo.label}</span>`;
          if ((data.status === 1 || data.status === 3) && data.staffConfirm === 1) {
            html += `<div style="font-size:9px;color:#2E7D32;text-align:center;margin-top:2px">✅確認済</div>`;
          }
        } else {
          html += `<div class="no-shift">-</div>`;
        }
        card.innerHTML = html;
        grid.appendChild(card);
      }
    }
  </script>
</body>
</html>
