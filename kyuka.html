<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有給申請</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    body { padding: 15px; background: #f5f5f5; }
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
    .balance-box { background: #fffde7; border: 1px solid #f9a825; border-radius: 8px; padding: 10px 15px; margin-bottom: 15px; text-align: center; font-size: 15px; }
    .balance-zero { background: #ffebee; border-color: #e53935; color: #e53935; }
    .user-info { text-align: right; font-size: 13px; color: #888; margin-bottom: 10px; }
    .logout-btn { font-size: 12px; color: #888; background: none; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 認証画面 -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div style="font-size:40px;margin-bottom:1rem">🔐</div>
      <h2 style="font-weight:bold;margin-bottom:0.5rem">スタッフ認証</h2>
      <p style="color:#888;font-size:13px;margin-bottom:1.5rem">お名前と電話番号を入力してください</p>
      <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
      <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
      <div id="authError" style="color:red;font-size:13px;margin-bottom:0.5rem;display:none">
        名前または電話番号が一致しません。
      </div>
      <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
    </div>
  </div>

  <!-- メインコンテンツ（認証後に表示） -->
  <div id="mainContent" style="display:none">
    <div class="user-info">
      <span id="displayName"></span>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
    <div class="card">
      <div class="card-content">
        <h2 style="font-weight:bold;text-align:center;margin-bottom:20px">🌴 有給申請フォーム</h2>

        <div id="balanceBox" class="balance-box">有給残日数を取得中...</div>

        <div class="field">
          <label class="label">お名前</label>
          <input class="input" type="text" id="userName" readonly style="background:#f5f5f5">
        </div>

        <div class="field">
          <label class="label">申請日</label>
          <input class="input" type="date" id="applyDate" required>
        </div>

        <div class="field">
          <label class="label">種類</label>
          <div class="select is-fullwidth">
            <select id="kind" onchange="checkBalance()">
              <option value="全休">全休</option>
              <option value="午前半休">午前半休</option>
              <option value="午後半休">午後半休</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="label">理由</label>
          <textarea class="textarea" id="reason" rows="3" placeholder="例：私用のため"></textarea>
        </div>

        <button id="submitBtn" class="button is-warning is-fullwidth is-large" style="margin-top:10px" onclick="sendKyuka()">
          <strong>この内容で申請する</strong>
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
    let currentBalance = 0;

    // 起動時にlocalStorageを確認
    window.onload = function() {
      const saved = localStorage.getItem('kintaiUser');
      if (saved) {
        const data = JSON.parse(saved);
        const now = new Date().getTime();
        if (now - data.loginTime < 24 * 60 * 60 * 1000) {
          showMain(data.name);
          return;
        } else {
          localStorage.removeItem('kintaiUser');
        }
      }
      document.getElementById('authScreen').style.display = 'flex';
    };

    function logout() {
      localStorage.removeItem('kintaiUser');
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
    }

    async function checkAuth() {
      const name = document.getElementById('authName').value.trim();
      const tel  = document.getElementById('authTel').value.trim();
      if (!name) { alert('お名前を入力してください'); return; }
      if (!tel)  { alert('電話番号を入力してください'); return; }

      const btn = document.querySelector('#authScreen button');
      btn.disabled = true;
      btn.textContent = '確認中...';

      try {
        const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
        const data = await res.json();
        if (data.auth) {
          localStorage.setItem('kintaiUser', JSON.stringify({ name, tel, loginTime: new Date().getTime() }));
          showMain(name);
        } else {
          document.getElementById('authError').style.display = 'block';
          btn.disabled = false;
          btn.textContent = '確認する';
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
        btn.disabled = false;
        btn.textContent = '確認する';
      }
    }

    async function showMain(name) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('userName').value = name;
      document.getElementById('displayName').textContent = name + ' さん';
      await loadBalance(name);
    }

    async function loadBalance(name) {
      try {
        const res  = await fetch(`${GAS_URL}?page=balance&name=${encodeURIComponent(name)}`);
        const data = await res.json();
        currentBalance = Number(data.balance) || 0;
        updateBalanceBox();
      } catch(err) {
        document.getElementById('balanceBox').textContent = '残日数の取得に失敗しました';
      }
    }

    function updateBalanceBox() {
      const box      = document.getElementById('balanceBox');
      const kind     = document.getElementById('kind').value;
      const required = kind === '全休' ? 1 : 0.5;
      if (currentBalance <= 0) {
        box.className = 'balance-box balance-zero';
        box.textContent = '⚠️ 有給残日数が0日のため申請できません';
        document.getElementById('submitBtn').disabled = true;
      } else if (currentBalance < required) {
        box.className = 'balance-box balance-zero';
        box.textContent = `⚠️ 有給残日数が${currentBalance}日のため${kind}の申請ができません`;
        document.getElementById('submitBtn').disabled = true;
      } else {
        box.className = 'balance-box';
        box.textContent = `🌿 有給残日数：${currentBalance}日`;
        document.getElementById('submitBtn').disabled = false;
      }
    }

    function checkBalance() { updateBalanceBox(); }

    async function sendKyuka() {
      const userName  = document.getElementById('userName').value.trim();
      const applyDate = document.getElementById('applyDate').value;
      const kind      = document.getElementById('kind').value;
      const reason    = document.getElementById('reason').value.trim();
      const required  = kind === '全休' ? 1 : 0.5;

      if (!applyDate) { alert('申請日を選択してください'); return; }
      if (!reason)    { alert('理由を入力してください'); return; }
      if (currentBalance < required) {
        alert(`⚠️ 有給残日数が不足しています。\n現在の残日数：${currentBalance}日\n申請に必要な日数：${required}日`);
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<strong>送信中...</strong>';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'kyukaRequest', userName, date: applyDate, kind, reason })
        });
        if (res.ok) {
          alert('申請が完了しました！\n名前：' + userName + '\n日付：' + applyDate + '\n種類：' + kind);
          document.getElementById('reason').value = '';
          currentBalance -= required;
          updateBalanceBox();
        } else {
          throw new Error('サーバーエラー: ' + res.status);
        }
      } catch(err) {
        alert('エラーが発生しました: ' + err);
        btn.disabled = false;
        btn.innerHTML = '<strong>この内容で申請する</strong>';
      }
    }
  </script>
</body>
</html>
