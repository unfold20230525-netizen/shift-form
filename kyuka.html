<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有給申請</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #16324F; --navy-hover: #1E4468; --navy-active: #0F2438;
      --sky: #4FA3D1; --sky-dark: #3A87B5; --sky-bg: #EAF4FA; --sky-border: #B9DDEE;
      --beige: #F5F0E6; --white: #FFFFFF;
      --gray-100: #F7F6F3; --gray-200: #E7E3DA; --gray-300: #D8D3C8;
      --gray-500: #8A8A85; --gray-700: #5B5B57; --text-main: #2B2B28; --text-body: #2B2B28;
      --disabled-bg: #D8D3C8; --disabled-text: #8A8A85;
      --error-bg: #FBEAEA; --error-text: #B3261E; --error-border: #E9B7B4;
      --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
      --shadow-card: 0 4px 24px rgba(22,50,79,0.08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--beige); color: var(--text-body); padding: 20px 16px 40px; -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
 
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 100%;
      max-width: 400px; text-align: center; box-shadow: var(--shadow-card); animation: fadeIn .3s ease-out;
    }
    .auth-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--sky-bg); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 1rem; }
    .auth-card h2 { color: var(--navy); font-weight: 700; margin-bottom: 0.35rem; font-size: 1.3rem; }
    .brand-tag { display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--sky-dark); font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; }
    .auth-card p.lead { color: var(--gray-700); font-size: 13px; margin-bottom: 1.5rem; }
    #authError { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text) !important; border-radius: 8px; padding: 8px 10px; }
 
    .input, .textarea {
      background: var(--white); border: 1px solid var(--gray-300); border-radius: 8px;
      font-size: 16px; padding: 12px 14px; color: var(--text-main);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder, .textarea::placeholder { color: var(--gray-500); }
    .input:focus, .textarea:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(79,163,209,0.18); outline: none; }
    .input[readonly] { background: var(--gray-100); color: var(--gray-700); }
    .label { color: var(--navy); font-weight: 700; font-size: 13px; }
 
    .button.is-info {
      background: var(--navy); border: none; font-weight: 700; border-radius: var(--radius-sm); height: auto;
      padding: 13px 14px; font-size: 15px; transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .button.is-info:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
    .button.is-info:active { background: var(--navy-active); transform: translateY(0) scale(0.99); box-shadow: none; }
 
    #mainContent { max-width: 480px; margin: 0 auto; }
    .user-info { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 13px; color: var(--gray-700); margin-bottom: 10px; }
    .logout-btn {
      font-size: 12px; color: var(--navy); background: var(--white); border: 1px solid var(--gray-300);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: background-color .15s ease;
    }
    .logout-btn:hover { background: var(--sky-bg); border-color: var(--sky); }
 
    .card { border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: none; animation: fadeIn .3s ease-out; }
    .card-content { padding: 2rem 1.6rem; }
    .page-title { text-align: center; margin-bottom: 20px !important; }
    .page-title .brand-tag { margin-bottom: 4px; }
    .page-title h2 { color: var(--navy); font-weight: 900 !important; font-size: 1.3rem; }
    .title-rule { width: 40px; height: 3px; background: var(--sky); border-radius: 2px; margin: 10px auto 0; }
 
    .balance-box {
      background: var(--sky-bg); border: 1px solid #B9DDEE; color: #1B6C93; border-radius: var(--radius-md);
      padding: 14px 15px; margin-bottom: 18px; text-align: center; font-size: 15px; font-weight: 700;
    }
    .balance-zero { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
 
    .tmpl-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tmpl-btn {
      border: 1px solid var(--navy); background: var(--white); color: var(--navy); border-radius: var(--radius-sm);
      padding: 9px 16px; font-size: 13px; cursor: pointer; transition: background-color .15s ease, color .15s ease, transform .1s ease;
    }
    .tmpl-btn:hover { background: var(--sky-bg); transform: translateY(-1px); }
    .tmpl-btn:active { transform: translateY(0) scale(0.98); }
    .tmpl-btn.active { background: var(--sky); color: white; border-color: var(--sky); }
 
    .button.is-warning {
      background: var(--navy); border: none; color: white; font-weight: 700; border-radius: var(--radius-sm);
      height: auto; padding: 16px; font-size: 15px; min-height: 56px;
      transition: background-color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .button.is-warning:hover { background: var(--navy-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(22,58,95,0.14); }
    .button.is-warning:active { transform: translateY(0) scale(0.99); box-shadow: none; }
    .button.is-warning[disabled] { background: var(--disabled-bg); color: var(--disabled-text); }
 
    /* 数字のみの日付入力（西暦・月・日） */
    .date-input-row { display: flex; align-items: center; gap: 6px; }
    .date-part-y { flex: 1.5; min-width: 0; text-align: center; padding-left: 6px; padding-right: 6px; }
    .date-part-s { flex: 1; min-width: 0; text-align: center; padding-left: 6px; padding-right: 6px; }
    .date-unit { font-size: 13px; color: var(--gray-700); flex-shrink: 0; }
  </style>
</head>
<body>
 
<div id="authScreen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <span class="brand-tag">ATTENDANCE MANAGEMENT</span>
    <h2>スタッフ認証</h2>
    <p class="lead">お名前と電話番号を入力してください</p>
    <input class="input" type="text" id="authName" placeholder="例：山田太郎" style="margin-bottom:0.75rem">
    <input class="input" type="tel" id="authTel" placeholder="例：09012345678" style="margin-bottom:1rem">
    <div id="authError" style="font-size:13px;margin-bottom:0.5rem;display:none">名前または電話番号が一致しません。</div>
    <button class="button is-info is-fullwidth" onclick="checkAuth()">確認する</button>
  </div>
</div>
 
<div id="mainContent" style="display:none">
  <div class="user-info">
    <span id="displayName"></span>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="card">
    <div class="card-content">
      <div class="page-title">
        <span class="brand-tag">勤怠管理システム</span>
        <h2>有給申請フォーム</h2>
        <div class="title-rule"></div>
      </div>
      <div id="balanceBox" class="balance-box">有給残日数を取得中...</div>
      <div class="field">
        <label class="label">お名前</label>
        <input class="input" type="text" id="userName" readonly>
      </div>
      <div class="field">
        <label class="label">申請日</label>
        <div class="date-input-row">
          <input class="input date-part-y" type="text" id="applyYear" placeholder="2026" inputmode="numeric" pattern="[0-9]*" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <span class="date-unit">年</span>
          <input class="input date-part-s" type="text" id="applyMonth" placeholder="6" inputmode="numeric" pattern="[0-9]*" maxlength="2" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <span class="date-unit">月</span>
          <input class="input date-part-s" type="text" id="applyDay" placeholder="11" inputmode="numeric" pattern="[0-9]*" maxlength="2" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <span class="date-unit">日</span>
        </div>
      </div>
      <div class="field">
        <label class="label">種類</label>
        <div class="tmpl-btns">
          <button class="tmpl-btn active" onclick="selectKind('全休',this)">全休</button>
          <button class="tmpl-btn" onclick="selectKind('午前半休',this)">午前半休</button>
          <button class="tmpl-btn" onclick="selectKind('午後半休',this)">午後半休</button>
        </div>
      </div>
      <div class="field">
        <label class="label">理由</label>
        <textarea class="textarea" id="reason" rows="3" placeholder="例：私用のため"></textarea>
      </div>
      <button id="submitBtn" class="button is-warning is-fullwidth is-large" style="margin-top:10px" onclick="sendKyuka()">
        <strong>この内容で申請する</strong>
      </button>
    </div>
  </div>
</div>
 
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwCfBE-qtwwgyGSk6vPEnWhMu1Y6i2GKvVZ8Xj-3jc3o0QlK_Or1_z7-rhcWkioAcFv_g/exec";
let currentBalance = 0;
let selectedKind = '全休';
 
function selectKind(kind, btn) {
  selectedKind = kind;
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateBalanceBox();
}
 
window.onload = function() {
  const saved = localStorage.getItem('kintaiUser');
  if (saved) {
    const data = JSON.parse(saved);
    if (new Date().getTime() - data.loginTime < 24*60*60*1000) { showMain(data.name); return; }
    else localStorage.removeItem('kintaiUser');
  }
  document.getElementById('authScreen').style.display = 'flex';
};
 
function logout() {
  localStorage.removeItem('kintaiUser');
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('mainContent').style.display = 'none';
}
 
async function checkAuth() {
  const name = document.getElementById('authName').value.trim();
  const tel  = document.getElementById('authTel').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  if (!tel)  { alert('電話番号を入力してください'); return; }
  const btn = document.querySelector('#authScreen button');
  btn.disabled = true; btn.textContent = '確認中...';
  try {
    const res  = await fetch(`${GAS_URL}?page=auth&name=${encodeURIComponent(name)}&tel=${encodeURIComponent(tel)}`);
    const data = await res.json();
    if (data.auth) {
      localStorage.setItem('kintaiUser', JSON.stringify({name, tel, loginTime: new Date().getTime()}));
      showMain(name);
    } else {
      document.getElementById('authError').style.display = 'block';
      btn.disabled = false; btn.textContent = '確認する';
    }
  } catch(err) { alert('エラー: '+err); btn.disabled=false; btn.textContent='確認する'; }
}
 
async function showMain(name) {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('userName').value = name;
  document.getElementById('displayName').textContent = name + ' さん';
  await loadBalance(name);
}
 
async function loadBalance(name) {
  try {
    const res  = await fetch(`${GAS_URL}?page=balance&name=${encodeURIComponent(name)}`);
    const data = await res.json();
    currentBalance = Number(data.balance) || 0;
    updateBalanceBox();
  } catch(err) { document.getElementById('balanceBox').textContent = '残日数の取得に失敗しました'; }
}
 
function updateBalanceBox() {
  const box = document.getElementById('balanceBox');
  const required = selectedKind === '全休' ? 1 : 0.5;
  if (currentBalance <= 0) {
    box.className = 'balance-box balance-zero';
    box.textContent = '⚠️ 有給残日数が0日のため申請できません';
    document.getElementById('submitBtn').disabled = true;
  } else if (currentBalance < required) {
    box.className = 'balance-box balance-zero';
    box.textContent = `⚠️ 有給残日数が${currentBalance}日のため${selectedKind}の申請ができません`;
    document.getElementById('submitBtn').disabled = true;
  } else {
    box.className = 'balance-box';
    box.textContent = `🌿 有給残日数：${currentBalance}日`;
    document.getElementById('submitBtn').disabled = false;
  }
}
 
// 西暦・月・日の入力欄から "YYYY/MM/DD" 形式の文字列を組み立てる
function getApplyDateStr() {
  const y = document.getElementById('applyYear').value.trim();
  const m = document.getElementById('applyMonth').value.trim();
  const d = document.getElementById('applyDay').value.trim();
  if (!y || !m || !d) return '';
  return `${y}/${m.padStart(2,'0')}/${d.padStart(2,'0')}`;
}
 
async function sendKyuka() {
  const userName  = document.getElementById('userName').value.trim();
  const applyDate = getApplyDateStr();
  const reason    = document.getElementById('reason').value.trim();
  const required  = selectedKind === '全休' ? 1 : 0.5;
 
  if (!applyDate) { alert('申請日（西暦・月・日）を入力してください'); return; }
  if (!reason)    { alert('理由を入力してください'); return; }
  if (currentBalance < required) {
    alert(`⚠️ 有給残日数が不足しています。\n現在の残日数：${currentBalance}日\n申請に必要な日数：${required}日`);
    return;
  }
 
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<strong>送信中...</strong>';
  try {
    const res = await fetch(GAS_URL, {method:'POST', body:JSON.stringify({type:'kyukaRequest', userName, date:applyDate, kind:selectedKind, reason})});
    if (res.ok) {
      alert('申請が完了しました！\n名前：'+userName+'\n日付：'+applyDate+'\n種類：'+selectedKind);
      document.getElementById('reason').value = '';
      document.getElementById('applyYear').value = '';
      document.getElementById('applyMonth').value = '';
      document.getElementById('applyDay').value = '';
      currentBalance -= required;
      updateBalanceBox();
    } else throw new Error('サーバーエラー: '+res.status);
  } catch(err) {
    alert('エラー: '+err);
    btn.disabled = false; btn.innerHTML = '<strong>この内容で申請する</strong>';
  }
}
</script>
</body>
</html>
